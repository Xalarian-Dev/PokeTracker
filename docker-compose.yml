# PokeTracker : deux services, « app » (site + API) et « db » (Postgres).
#
#   cp .env.docker.example .env      # puis remplir les valeurs
#   docker compose up -d --build
#
# Voir docker/README.md (démarrage, sauvegardes, migration depuis Supabase, HTTPS).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poketracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans le fichier .env}
      POSTGRES_DB: ${POSTGRES_DB:-poketracker}
    volumes:
      # données : persistent entre les redémarrages (ne PAS supprimer ce volume sans sauvegarde)
      - db_data:/var/lib/postgresql/data
      # schéma créé au tout premier démarrage seulement
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Aucun port publié : la base n'est joignable que par le service « app », sur le réseau interne.

  app:
    build:
      context: .
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?Définissez VITE_CLERK_PUBLISHABLE_KEY dans le fichier .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-poketracker}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-poketracker}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Définissez CLERK_SECRET_KEY dans le fichier .env}
    ports:
      # À placer derrière un proxy HTTPS (Caddy, Traefik, Nginx…). Pour n'accepter que la machine
      # elle-même : "127.0.0.1:${APP_PORT:-3000}:3000"
      - "${APP_PORT:-3000}:3000"

volumes:
  db_data:
